name: hideck-image-build

services:
  hideck:
    image: ghcr.io/a765616527/hideck:${HIDECK_VERSION:-2.1.23}
    build:
      context: .
      dockerfile: Dockerfile.release
      pull: true
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        VERSION: v${HIDECK_VERSION:-2.1.23}
        REVISION: ${HIDECK_REVISION:?HIDECK_REVISION is required}
        BUILDTIME: ${HIDECK_BUILDTIME:?HIDECK_BUILDTIME is required}
      tags:
        - ghcr.io/a765616527/hideck:${HIDECK_MINOR_VERSION:-2.1}
        - ghcr.io/a765616527/hideck:${HIDECK_LATEST_TAG:-latest}
      provenance: false
      sbom: false
