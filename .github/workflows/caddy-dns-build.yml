name: caddy-dns-build

on:
  push:
    branches:
      - main
    paths:
      - 'caddy-dns-image/**'
      - '.github/workflows/caddy-dns-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./caddy-dns-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/a765616527/hideck-caddy-dns:2.11.4
            ghcr.io/a765616527/hideck-caddy-dns:latest
          provenance: false
          sbom: false
